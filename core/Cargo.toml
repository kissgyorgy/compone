[package]
name = "compone-rust"
version = "0.5.0"
edition = "2021"
rust-version = "1.75"
description = "Rust extension for compone core"
license = "MIT"
repository = "https://github.com/kissgyorgy/compone"

[lib]
name = "compone"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29.0", features = ["abi3-py310", "extension-module"] }
smallvec = "1.15.1"

[profile.release]
lto = "fat"
codegen-units = 1
